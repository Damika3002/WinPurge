<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0c0c0c; stroke: #2a2a2a; stroke-width: 1; }
      .header-bg { fill: #161b22; }
      .row-even { fill: #0f141c; }
      .row-odd { fill: #090d13; }
      .divider { stroke: #21262d; stroke-width: 1; }
      .col-divider { stroke: #1f2937; stroke-width: 1; stroke-dasharray: 2 2; }
      
      /* WinPurge Highlight Column */
      .wp-col-bg { fill: rgba(14, 165, 233, 0.05); }
      .wp-col-border { stroke: #0284c7; stroke-width: 1.5; fill: none; }
      .wp-header-badge { fill: #0369a1; }
      .wp-badge-text { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 9.5px; font-weight: 800; fill: #e0f2fe; text-anchor: middle; letter-spacing: 0.5px; }

      /* Typography */
      .th-metric { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #8b949e; letter-spacing: 0.5px; }
      .th-wp { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #38bdf8; text-anchor: middle; }
      .th-other { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #8b949e; text-anchor: middle; }
      
      .row-title { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f0f6fc; }
      
      /* Status Pill Styles */
      .val-wp { font-family: "Consolas", monospace; font-size: 11px; font-weight: 700; fill: #34d399; text-anchor: middle; }
      .val-bad { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #f87171; text-anchor: middle; }
      .val-warn { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #fbbf24; text-anchor: middle; }
      .val-ok { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #4ade80; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="780" height="370" class="bg" rx="6" />

  <!-- WinPurge Highlight Background Stripe -->
  <rect x="245" y="0" width="185" height="370" class="wp-col-bg" />

  <!-- Table Header Bar -->
  <rect x="0" y="0" width="780" height="52" class="header-bg" rx="6" />
  
  <!-- Header Text -->
  <text x="24" y="32" class="th-metric">FEATURE &amp; SAFETY METRIC</text>
  
  <!-- WinPurge Header + Badge -->
  <text x="337" y="27" class="th-wp">WinPurge v1.0</text>
  <rect x="290" y="34" width="95" height="14" class="wp-header-badge" rx="3" />
  <text x="337" y="44" class="wp-badge-text">RECOMMENDED</text>

  <!-- Other Headers -->
  <text x="515" y="32" class="th-other">Commercial Cleaners</text>
  <text x="680" y="32" class="th-other">Generic Batch Scripts</text>

  <line x1="0" y1="52" x2="780" y2="52" class="divider" />

  <!-- Vertical Column Dividers -->
  <line x1="245" y1="0" x2="245" y2="370" class="divider" />
  <line x1="430" y1="0" x2="430" y2="370" class="divider" />
  <line x1="600" y1="0" x2="600" y2="370" class="col-divider" />

  <!-- ROW 1: Background Telemetry -->
  <rect x="0" y="52" width="780" height="53" class="row-odd" />
  <text x="24" y="83" class="row-title">Background Telemetry &amp; Services</text>
  <text x="337" y="83" class="val-wp">[&#x2714;] Zero Daemons</text>
  <text x="515" y="83" class="val-bad">&#x2718; Resident TSR / Tracking</text>
  <text x="680" y="83" class="val-ok">&#x2714; Zero Daemons</text>
  <line x1="0" y1="105" x2="780" y2="105" class="divider" />

  <!-- ROW 2: Installation & Dependencies -->
  <rect x="0" y="105" width="780" height="53" class="row-even" />
  <text x="24" y="136" class="row-title">Installation &amp; Dependencies</text>
  <text x="337" y="136" class="val-wp">[&#x2714;] Portable Native Batch</text>
  <text x="515" y="136" class="val-bad">&#x2718; Full Setup &amp; Extras</text>
  <text x="680" y="136" class="val-ok">&#x2714; Portable .bat</text>
  <line x1="0" y1="158" x2="780" y2="158" class="divider" />

  <!-- ROW 3: Deletion Metrics -->
  <rect x="0" y="158" width="780" height="53" class="row-odd" />
  <text x="24" y="189" class="row-title">File Deletion Accounting</text>
  <text x="337" y="189" class="val-wp">[&#x2714;] Real Before / After</text>
  <text x="515" y="189" class="val-warn">&#x26A0; Estimated Guess</text>
  <text x="680" y="189" class="val-bad">&#x2718; Blind Deletion (&gt;nul)</text>
  <line x1="0" y1="211" x2="780" y2="211" class="divider" />

  <!-- ROW 4: Locked File Handling -->
  <rect x="0" y="211" width="780" height="53" class="row-even" />
  <text x="24" y="242" class="row-title">In-Use / Locked File Protection</text>
  <text x="337" y="242" class="val-wp">[&#x2714;] Tracked &amp; Skipped</text>
  <text x="515" y="242" class="val-warn">&#x26A0; Force Unlock Risk</text>
  <text x="680" y="242" class="val-bad">&#x2718; Fails Silently</text>
  <line x1="0" y1="264" x2="780" y2="264" class="divider" />

  <!-- ROW 5: Windows Servicing (DISM) -->
  <rect x="0" y="264" width="780" height="53" class="row-odd" />
  <text x="24" y="295" class="row-title">Windows Component Store (DISM)</text>
  <text x="337" y="295" class="val-wp">[&#x2714;] Live Progress Stream</text>
  <text x="515" y="295" class="val-bad">&#x2718; Not Supported</text>
  <text x="680" y="295" class="val-bad">&#x2718; Hidden / Frozen</text>
  <line x1="0" y1="317" x2="780" y2="317" class="divider" />

  <!-- ROW 6: Recycle Bin Protection -->
  <rect x="0" y="317" width="780" height="53" class="row-even" />
  <text x="24" y="348" class="row-title">Recycle Bin Safety Default</text>
  <text x="337" y="348" class="val-wp">[&#x2714;] Safe Default [N]</text>
  <text x="515" y="348" class="val-warn">&#x26A0; Auto-Purge Default</text>
  <text x="680" y="348" class="val-bad">&#x2718; Forced Wipe / No Choice</text>

  <!-- WinPurge Column Highlight Outer Border -->
  <rect x="245" y="0" width="185" height="370" class="wp-col-border" rx="1" />
</svg>
