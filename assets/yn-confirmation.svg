<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0c0c0c; stroke: #2a2a2a; stroke-width: 1; }
      .box { fill: #141414; stroke: #333333; stroke-width: 1; }
      .titlebar { fill: #ffffff; }
      .title-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #1a1a1a; font-weight: 600; }
      .mono-text { font-family: "Consolas", "Courier New", monospace; font-size: 11.5px; fill: #cccccc; }
      .c-green { fill: #16c60c; font-weight: bold; }
      .c-red { fill: #e74856; font-weight: bold; }
      .c-cyan { fill: #38bdf8; }
      .c-yellow { fill: #f5c518; }
      .c-white { fill: #ffffff; font-weight: 600; }
      .c-gray { fill: #767676; }
      .badge-pass { fill: #064e3b; stroke: #10b981; stroke-width: 1; }
      .badge-warn { fill: #7f1d1d; stroke: #ef4444; stroke-width: 1; }
      .badge-lbl { font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="680" height="260" class="bg" />

  <!-- LEFT CARD: Prompt 1 - Initial Confirmation -->
  <g transform="translate(15, 15)">
    <rect width="315" height="230" class="box" />
    <rect width="315" height="24" class="titlebar" />
    <text x="10" y="16" class="title-text">PROMPT 1: STARTUP CONFIRMATION</text>
    
    <!-- Safe Default Badge -->
    <rect x="210" y="32" width="95" height="18" class="badge-pass" rx="2" />
    <text x="257" y="45" class="badge-lbl">DEFAULT: PROCEED</text>

    <!-- Terminal Content -->
    <g transform="translate(12, 60)" class="mono-text">
      <text x="0" y="0" class="c-white">Ready to execute cleanup...</text>
      <text x="0" y="24">Start cleanup process?</text>
      <text x="0" y="42">[<tspan class="c-green">Y</tspan>] Yes <tspan class="c-gray">[default]</tspan> / [<tspan class="c-cyan">N</tspan>] No</text>
      <text x="0" y="66">Your choice [Y/N] &gt; <tspan class="c-green">Y</tspan></text>
      
      <line x1="0" y1="84" x2="290" y2="84" stroke="#252525" stroke-width="1" />

      <text x="0" y="104" class="c-gray">Action Details:</text>
      <text x="0" y="122" class="c-gray">&#x2022; Pressing <tspan class="c-white">Enter</tspan> chooses [Y].</text>
      <text x="0" y="138" class="c-gray">&#x2022; Safe start of maintenance routine.</text>
      <text x="0" y="154" class="c-gray">&#x2022; Bypassed with <tspan class="c-cyan">/y</tspan> or <tspan class="c-cyan">AUTO_CONFIRM=1</tspan>.</text>
    </g>
  </g>

  <!-- RIGHT CARD: Prompt 2 - Recycle Bin Warning -->
  <g transform="translate(350, 15)">
    <rect width="315" height="230" class="box" />
    <rect width="315" height="24" class="titlebar" />
    <text x="10" y="16" class="title-text">PROMPT 2: RECYCLE BIN PURGE</text>

    <!-- Protection Default Badge -->
    <rect x="210" y="32" width="95" height="18" class="badge-warn" rx="2" />
    <text x="257" y="45" class="badge-lbl">DEFAULT: PROTECT</text>

    <!-- Terminal Content -->
    <g transform="translate(12, 60)" class="mono-text">
      <text x="0" y="0" class="c-yellow">[ NOTICE ] Items cannot be recovered.</text>
      <text x="0" y="24">Permanently empty Recycle Bin?</text>
      <text x="0" y="42">[<tspan class="c-red">Y</tspan>] Yes / [<tspan class="c-green">N</tspan>] No <tspan class="c-gray">[default]</tspan></text>
      <text x="0" y="66">Your choice [Y/N] &gt; <tspan class="c-green">N</tspan></text>

      <line x1="0" y1="84" x2="290" y2="84" stroke="#252525" stroke-width="1" />

      <text x="0" y="104" class="c-gray">Action Details:</text>
      <text x="0" y="122" class="c-gray">&#x2022; Pressing <tspan class="c-white">Enter</tspan> chooses [N].</text>
      <text x="0" y="138" class="c-gray">&#x2022; Preserves all recycled files safely.</text>
      <text x="0" y="154" class="c-gray">&#x2022; Bypassed with <tspan class="c-red">/norecycle</tspan> in CLI/.env.</text>
    </g>
  </g>
</svg>
